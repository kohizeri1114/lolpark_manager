<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light">
<title>ろるぱーくカスタム管理アプリ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>/* 配色: 夜の配信画面。青と赤はチームの色、金だけがDGP（点数）の色。
   構成: 上に流れるお知らせ / 見出し+団体 / 4つの画面 / スマホは下に操作バー */
:root{
  --bg:#0a111e;--bg-2:#0d1626;--panel:#121c30;--panel-2:#17233b;--line:#243251;--line-2:#33466f;
  --ink:#e8edf8;--ink-2:#a9b7d2;--ink-3:#8190b0;
  --blue:#5b9bff;--blue-bg:rgba(91,155,255,.13);--blue-ln:rgba(91,155,255,.5);
  --red:#ff6b7a;--red-bg:rgba(255,107,122,.13);--red-ln:rgba(255,107,122,.5);
  --gold:#f1c45c;--gold-t:#f1c45c;--gold-ink:#1b1405;--gold-bg:rgba(241,196,92,.13);
  --ok:#3ecf8e;--warn:#f5a524;--bad:#ff6b7a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --shadow:0 10px 32px rgba(0,0,0,.5);--r:4px;--rl:8px;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e9eff8;--bg-2:#e1e9f5;--panel:#ffffff;--panel-2:#f2f6fb;--line:#d2ddee;--line-2:#b5c6e0;
  --ink:#0e1a30;--ink-2:#44587a;--ink-3:#5d7092;
  --blue:#1f63e0;--blue-bg:rgba(31,99,224,.09);--blue-ln:rgba(31,99,224,.45);
  --red:#d6304a;--red-bg:rgba(214,48,74,.09);--red-ln:rgba(214,48,74,.45);
  --gold:#e3a51d;--gold-t:#8a5d00;--gold-ink:#1b1405;--gold-bg:rgba(227,165,29,.16);
  --ok:#12805a;--warn:#a65f00;--bad:#c42b3d;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --shadow:0 10px 30px rgba(20,40,80,.16);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e9eff8;--bg-2:#e1e9f5;--panel:#ffffff;--panel-2:#f2f6fb;--line:#d2ddee;--line-2:#b5c6e0;
  --ink:#0e1a30;--ink-2:#44587a;--ink-3:#5d7092;
  --blue:#1f63e0;--blue-bg:rgba(31,99,224,.09);--blue-ln:rgba(31,99,224,.45);
  --red:#d6304a;--red-bg:rgba(214,48,74,.09);--red-ln:rgba(214,48,74,.45);
  --gold:#e3a51d;--gold-t:#8a5d00;--gold-ink:#1b1405;--gold-bg:rgba(227,165,29,.16);
  --ok:#12805a;--warn:#a65f00;--bad:#c42b3d;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --shadow:0 10px 30px rgba(20,40,80,.16);color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--f-body);min-height:100vh;
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){body{padding-bottom:40px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
b,strong{font-weight:700}
.num{font-family:var(--f-num);font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.mu{color:var(--ink-2);font-size:12px;line-height:1.5}
.mu3{color:var(--ink-3);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- 上に流れるお知らせ ---- */
.ticker{overflow:hidden;white-space:nowrap;background:var(--bg-2);border-bottom:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:5px 0}
.ticker-in{display:inline-block;padding-left:100%;animation:tick var(--d,30s) linear infinite}
.ticker:hover .ticker-in{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---- 見出し ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:19px;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--ink-3);font-size:12px}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 28px 6px 10px;font-weight:500;min-height:34px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.save{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save.bad{color:var(--bad);font-weight:700}.save.bad i{background:var(--bad)}
.tabs{display:none}
@media(min-width:900px){
  .tabs{display:flex;gap:2px;margin-left:8px}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 14px 12px;font-weight:700;color:var(--ink-2)}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-current=page]{color:var(--ink);border-color:var(--gold)}
}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--ink-3);font-size:11px;font-weight:700}
.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar button[aria-current=page]{color:var(--gold-t)}
@media(min-width:900px){.bar{display:none}}

main{padding-block:18px 28px}
h2.sec{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .mu{font-weight:400}

/* ---- 部品 ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:14px}
.card+.card{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);border-radius:var(--r);padding:7px 13px;font-weight:700;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}.btn.ghost:hover{color:var(--ink);background:var(--panel-2)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#06101f}
.btn.red{background:var(--red);border-color:var(--red);color:#1f0509}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cta{position:relative;isolation:isolate;border:0;background:none;color:var(--gold-ink);font-weight:800;font-size:15px;padding:11px 26px;min-height:46px;letter-spacing:.02em}
.cta::before{content:"";position:absolute;inset:0;background:var(--gold);transform:skewX(-9deg);z-index:-1;border-radius:2px;transition:filter .15s}
.cta:hover::before{filter:brightness(1.08)}
.cta:active::before{filter:brightness(.94)}
.field{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-height:36px;min-width:0}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-color:var(--blue)}
textarea.field{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap;min-height:24px}
.chip.btnlike{cursor:pointer}.chip.btnlike:hover{border-color:var(--ink-3);color:var(--ink)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:3px;line-height:17px;border:1px solid}
.tag.new{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.tag.sit{color:var(--blue);border-color:var(--blue-ln)}
.tag.gold{color:var(--gold-t);border-color:color-mix(in srgb,var(--gold-t) 55%,transparent);background:var(--gold-bg)}
.tag.dim{color:var(--ink-3);border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:3px 9px;font-size:12px;font-weight:700;color:var(--ink-2);min-height:28px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button.b[aria-pressed=true]{background:var(--blue);color:#06101f}.seg button.r[aria-pressed=true]{background:var(--red);color:#1f0509}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-weight:700}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line-2);flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.sw input:checked+i{background:var(--gold)}.sw input:checked+i::after{transform:translateX(16px);background:var(--gold-ink)}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.delta{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}.delta.z{color:var(--ink-3)}
.dgp{font-family:var(--f-num);font-weight:700;color:var(--gold-t);font-variant-numeric:tabular-nums}
.dgp.none{color:var(--ink-3);font-weight:500}
.dgp small{font-size:.62em;font-weight:600;margin-left:2px;opacity:.85}
.empty{border:1px dashed var(--line-2);border-radius:var(--rl);padding:34px 20px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--ink)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-radius:var(--rl);padding:9px 12px;margin-bottom:12px;font-size:13px}
.banner.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}

/* ---- 対戦: 参加者とボード ---- */
.stage{display:grid;gap:16px;align-items:start;grid-template-columns:minmax(0,1fr)}.stage>*,.set>*{min-width:0}
@media(min-width:980px){.stage{grid-template-columns:340px minmax(0,1fr)}.side{position:sticky;top:72px}}
.add{display:flex;gap:6px}.add .field{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.rost{margin-top:10px;display:grid;gap:4px}
.rm{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.rm[open]{border-color:var(--line-2)}
.rm>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 9px;cursor:pointer;min-height:38px}
.rm>summary::-webkit-details-marker{display:none}
.rm .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm .tags{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.rm .ed{padding:4px 9px 10px;display:grid;gap:9px;border-top:1px solid var(--line)}
.rm .ed .l{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.opts{margin-top:12px;display:grid;gap:11px}
.opts .cta{width:100%}

.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.plan button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:9px 11px;display:grid;gap:4px}
.plan button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.plan b{font-size:13px}.plan .d{font-size:12px;color:var(--ink-2)}
@media(max-width:520px){.plan{grid-template-columns:1fr}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-bottom:12px}
.vs .s{display:grid;gap:0}.vs .s.r{text-align:right}
.vs .big{font-size:clamp(34px,6vw,54px);line-height:1;font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.vs .s.b .big{color:var(--blue)}.vs .s.r .big{color:var(--red)}
.vs .big small{font-size:.3em;color:var(--ink-3);margin-left:4px;font-weight:600}
.vs .mid{text-align:center;display:grid;gap:3px;justify-items:center;padding-bottom:4px}
.vs .diff{font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;border:1px solid;white-space:nowrap}
.diff.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.diff.mid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.diff.ng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.gauge{height:8px;border-radius:4px;overflow:hidden;display:flex;gap:2px;margin:8px 0 3px}
.gauge i{display:block;height:100%}.gauge .b{background:var(--blue)}.gauge .r{background:var(--red)}
.gl{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.gl span:first-child{color:var(--blue)}.gl span:last-child{color:var(--red)}
.teams{display:grid;gap:12px}
@media(min-width:760px){.teams{grid-template-columns:1fr 1fr}}
.team{border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;background:var(--panel)}
.team.b{border-color:var(--blue-ln)}.team.r{border-color:var(--red-ln)}
.th{position:relative;display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:15px}
.team.b .th{background:var(--blue-bg);color:var(--blue)}.team.r .th{background:var(--red-bg);color:var(--red)}
.th .tg{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);text-align:right}
.th .tg b{font-family:var(--f-num);font-size:13px}
.pl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;padding:9px 12px;border-top:1px solid var(--line)}
.pl .rl{display:flex;flex-direction:column;gap:5px}
.pl select.mini{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:3px 2px;font-size:11.5px;font-weight:700;color:var(--ink-2);text-align:center;text-align-last:center;min-height:28px}
.pl .hd{display:flex;align-items:center;gap:8px;min-width:0}
.pl .hd .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .hd .dgp{font-size:15px}
.pl .hd .x{margin-left:auto}
.pl .in{display:flex;gap:5px;margin-top:5px;flex-wrap:nowrap}
.pl .in .ch{flex:1;min-width:0}
.pl .in .kn{width:48px;text-align:center;padding-inline:2px;flex:none;font-family:var(--f-num);font-weight:600;font-size:15px}
.pl .qp{grid-column:2;display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
.pl .qp .chip{font-size:11.5px;min-height:22px;padding:0 8px}
.warns{margin-top:10px;display:grid;gap:5px}
.warn{border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--panel));color:var(--ink);border-radius:var(--r);padding:7px 11px;font-size:12.5px}
.spec{margin-top:12px}
.dock{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--rl);padding:9px}
@media(min-width:900px){.dock{bottom:12px}}
.dock .win{flex:1;min-width:150px}

/* ---- リザルト ---- */
.res-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.res-h h3{margin:0;font-size:22px}
.res-h.b h3{color:var(--blue)}.res-h.r h3{color:var(--red)}
.rtab{width:100%;border-collapse:collapse}
.rtab th{font-size:11.5px;color:var(--ink-3);font-weight:500;text-align:left;padding:5px 8px}
.rtab td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.rtab .n{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.rtab tr.w td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.parts{display:flex;gap:4px;flex-wrap:wrap}
.parts .tag{font-family:var(--f-num);font-size:12px}
.tw{overflow-x:auto}

/* ---- ランキング ---- */
.sub{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.sub button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-weight:700;color:var(--ink-2);margin-bottom:-1px}
.sub button[aria-pressed=true]{color:var(--ink);border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:var(--rl);padding:9px 12px;background:var(--panel)}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.15}
.kpi .v.t{font-family:var(--f-body);font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{display:grid;gap:4px}
.lr{display:grid;grid-template-columns:34px minmax(0,1.5fr) 92px minmax(0,1fr) 74px 74px 84px;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
.lr:hover{border-color:var(--line-2);background:var(--panel-2)}
.lr .rk{font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--ink-3);text-align:center}
.lr.r1 .rk{color:var(--gold-t)}
.lr.r1{border-color:color-mix(in srgb,var(--gold-t) 45%,var(--line))}
.lr .who{min-width:0}.lr .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .who .tt{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.lr .pts{text-align:right}.lr .pts .dgp{font-size:26px;line-height:1}
.lr .pts .delta{font-size:12px;display:block}
.lr .rec{font-size:12px;color:var(--ink-2)}
.lr .bar2{height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}.lr .bar2 i{display:block;height:100%;background:var(--ink-3)}
.lr .kda{font-family:var(--f-num);font-size:16px;font-weight:600;text-align:right}
.form{display:flex;gap:3px;justify-content:flex-end}
.form i{width:9px;height:9px;border-radius:2px;background:var(--line-2)}.form i.w{background:var(--ok)}.form i.l{background:var(--bad)}
.lr svg.sp{width:84px;height:28px}
.lhead{display:grid;grid-template-columns:34px minmax(0,1.5fr) 92px minmax(0,1fr) 74px 74px 84px;gap:10px;padding:0 12px 4px;font-size:11.5px;color:var(--ink-3)}
@media(max-width:820px){
  .lr{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"rk who pts" ". rec kda";row-gap:4px}

      series[n].push({v,mi:mx+1,diff:u.d,tg:u.tg,kd:u.kd,sb:u.sb,win:!!u.win,role:u.p.role||"",champ:u.p.champ||"",k:u.p.k,d:u.p.d,a:u.p.a,mid:m.id,date:m.date});
    }
  });
  return{rt,pk,series,per,info};
}

// ---------- 集計（戦績・相性・チャンピオン） ----------
function computeStats(history){
  const S={};
  const get=n=>S[n]||(S[n]={name:n,g:0,w:0,k:0,d:0,a:0,kg:0,champs:{},roles:{},res:[],partners:{},rivals:{},first:-1,last:-1});
  history.forEach((m,mx)=>{
    for(const sd of["blue","red"]){
      const team=m[sd],opp=m[sd==="blue"?"red":"blue"],win=m.winner===sd;
      for(const p of team){
        const a=get(p.name);a.g++;if(win)a.w++;a.res.push(win);a.last=mx;if(a.first<0)a.first=mx;
        const kd=hasKDA(p);
        if(kd){a.k+=p.k;a.d+=p.d;a.a+=p.a;a.kg++;}
        if(p.champ){const c=a.champs[p.champ]||(a.champs[p.champ]={g:0,w:0,k:0,d:0,a:0,kg:0});c.g++;if(win)c.w++;if(kd){c.k+=p.k;c.d+=p.d;c.a+=p.a;c.kg++;}}
        if(p.role){const r=a.roles[p.role]||(a.roles[p.role]={g:0,w:0});r.g++;if(win)r.w++;}
        for(const q of team)if(q.name!==p.name){const t=a.partners[q.name]||(a.partners[q.name]={g:0,w:0});t.g++;if(win)t.w++;}
        for(const q of opp){const t=a.rivals[q.name]||(a.rivals[q.name]={g:0,w:0});t.g++;if(win)t.w++;}
      }
    }
  });
  return S;
}
// 直近の試合を連続で観戦している回数（休みが続いた人を次の抽選で優先するため）
function sitStreaks(history,names){
  const o={};
  for(const n of names){
    let c=0;
    for(let i=history.length-1;i>=0;i--){
      const m=history[i];
      if(m.blue.some(p=>p.name===n)||m.red.some(p=>p.name===n))break;
      if((m.spec||[]).includes(n))c++;else break;
    }
    o[n]=c;
  }
  return o;
}

// ---------- 記録の殿堂 ----------
function computeRecords(history,rat,stats){
  const out={};
  let peak=null;for(const n in rat.pk)if(!peak||rat.pk[n]>peak.v)peak={name:n,v:rat.pk[n]};
  out.peak=peak;
  let ls=null;for(const n in stats){const b=streakOf(stats[n].res).bw;if(b>0&&(!ls||b>ls.v))ls={name:n,v:b};}
  out.longStreak=ls;
  let up=null;
  history.forEach((m,mx)=>{
    const i=rat.info[m.id];if(!i||!m.blue.length||!m.red.length)return;
    const eW=m.winner==="blue"?i.eBlue:1-i.eBlue;
    if(!up||eW<up.e)up={e:eW,m,mx,ab:i.ab,ar:i.ar};
  });
  out.upset=up;
  let bk=null,mk=null,gain=null,loss=null;
  history.forEach((m,mx)=>{
    for(const sd of["blue","red"])for(const p of m[sd]){
      if(hasKDA(p)){
        const v=kdaOf(p.k,p.d,p.a);
        if(p.k+p.a>=8&&(!bk||v>bk.v))bk={v,p,m,mx};
        if(!mk||p.k>mk.v)mk={v:p.k,p,m,mx};
      }
      const e=rat.per[m.id]&&rat.per[m.id][p.name];
      if(e){if(!gain||e.d>gain.v)gain={v:e.d,name:p.name,m,mx};if(!loss||e.d<loss.v)loss={v:e.d,name:p.name,m,mx};}
    }
  });
  out.bestKDA=bk;out.mostKills=mk;out.bigGain=gain;out.bigLoss=loss;
  let mg=null,bw=null;
  for(const n in stats){const s=stats[n];if(!mg||s.g>mg.v)mg={name:n,v:s.g};if(s.g>=5){const r=s.w/s.g;if(!bw||r>bw.v)bw={name:n,v:r,g:s.g};}}
  out.mostGames=mg;out.bestWin=bw;
  const ch={};
  for(const n in stats)for(const c in stats[n].champs){const t=ch[c]||(ch[c]={g:0,w:0});t.g+=stats[n].champs[c].g;t.w+=stats[n].champs[c].w;}
  let mc=null,bc=null;
  for(const c in ch){if(!mc||ch[c].g>mc.g)mc={name:c,g:ch[c].g};if(ch[c].g>=4){const r=ch[c].w/ch[c].g;if(!bc||r>bc.v)bc={name:c,v:r,g:ch[c].g};}}
  out.topChamp=mc;out.bestChamp=bc;
  return out;
}

// ---------- 称号（自動で付く、遊びの勲章） ----------
function computeTitles(history,rat,stats,rec){
  const T={};const add=(n,key,label,desc)=>(T[n]||(T[n]=[])).push({key,label,desc});
  const names=Object.keys(stats);
  const rank=names.slice().sort((a,b)=>rat.rt[b]-rat.rt[a]||stats[b].g-stats[a].g);
  if(rank.length>=3&&stats[rank[0]].g>=5)add(rank[0],"king","首位","現在DGP1位（5試合以上）");
  names.forEach(n=>{
    const s=stats[n],st=streakOf(s.res);
    if(st.cur>=3)add(n,"hot",st.cur+"連勝中","現在3連勝以上");
    if(rec.longStreak&&rec.longStreak.name===n&&rec.longStreak.v>=4)add(n,"streak","最長連勝 "+rec.longStreak.v,"団体内の最長連勝記録");
    const rg=Object.entries(s.roles),rn=rg.reduce((a,[,v])=>a+v.g,0);
    if(rn>=6){const [r,v]=rg.sort((a,b)=>b[1].g-a[1].g)[0];if(v.g/rn>=0.7)add(n,"role",r+"専","ロール指定の試合の7割以上が"+r);}
    const cg=Object.entries(s.champs),cn=cg.reduce((a,[,v])=>a+v.g,0);
    if(cn>=6){const [c,v]=cg.sort((a,b)=>b[1].g-a[1].g)[0];if(v.g/cn>=0.5)add(n,"champ",c+"一筋","チャンピオンが記録された試合の半分以上が"+c);}
    if(cn>=12&&cg.length>=8)add(n,"wide","雑食",cg.length+"種類のチャンピオンを使用");
    if(st.bl>=3){ // 3連敗以上のあとに勝ったことがある
      let run=0,comeback=false;for(const x of s.res){if(x){if(run>=3)comeback=true;run=0;}else run++;}
      if(comeback)add(n,"back","不屈","3連敗以上のあとに勝利");
    }
    const last5=history.slice(-5);
    if(history.length>=5&&last5.every(m=>m.blue.some(p=>p.name===n)||m.red.some(p=>p.name===n)))add(n,"present","皆勤","直近5試合すべてに出場");
  });
  const kdaRank=names.filter(n=>stats[n].kg>=5).sort((a,b)=>kdaOf(stats[b].k,stats[b].d,stats[b].a)-kdaOf(stats[a].k,stats[a].d,stats[a].a));
  if(kdaRank.length>=3)add(kdaRank[0],"kda","KDAの鬼","KDA入力5試合以上の中で平均KDA最高");
  if(rec.upset&&rec.upset.e<0.45){
    const w=rec.upset.m[rec.upset.m.winner];w.forEach(p=>add(p.name,"upset","番狂わせ","団体内で最も期待勝率の低い試合に勝利"));
  }
  return T;
}

// ---------- チーム編成エンジン ----------
const popcount=m=>{let c=0;while(m){c+=m&1;m>>=1;}return c;};
function rolePerms(k){
  const out=[],used=[false,false,false,false,false],cur=[];
  (function rec(){
    if(cur.length===k){out.push(cur.slice());return;}
    for(let r=0;r<5;r++)if(!used[r]){used[r]=true;cur.push(r);rec();cur.pop();used[r]=false;}
  })();
  return out;
}
// 希望ロールを最大限かなえる割り当てだけを残す
function bestPerms(team){
  const k=Math.min(team.length,5),pr=team.map(p=>ROLES.indexOf(p.pref));
  const perms=rolePerms(k);let best=-1,keep=[];
  for(const pm of perms){let s=0;for(let i=0;i<k;i++)if(pm[i]===pr[i])s++;if(s>best){best=s;keep=[pm];}else if(s===best)keep.push(pm);}
  return{perms:keep,score:best};
}
function assignRoles(B,R,dg,balance,rng){
  const bb=bestPerms(B),rr=bestPerms(R);
  const lanes=(team,pm)=>{const o=[null,null,null,null,null];pm.forEach((r,i)=>{o[r]=dg(team[i].name);});return o;};
  let pickB,pickR,bestCost=Infinity;
  if(!balance){pickB=bb.perms[Math.floor(rng()*bb.perms.length)];pickR=rr.perms[Math.floor(rng()*rr.perms.length)];}
  else{
    const lb=bb.perms.map(p=>lanes(B,p)),lr=rr.perms.map(p=>lanes(R,p));let ties=0;
    for(let i=0;i<lb.length;i++)for(let j=0;j<lr.length;j++){
      let c=0;for(let r=0;r<5;r++)if(lb[i][r]!=null&&lr[j][r]!=null)c+=Math.abs(lb[i][r]-lr[j][r]);
      if(c<bestCost-1e-9){bestCost=c;pickB=bb.perms[i];pickR=rr.perms[j];ties=1;}
      else if(Math.abs(c-bestCost)<=1e-9){ties++;if(rng()<1/ties){pickB=bb.perms[i];pickR=rr.perms[j];}}
    }
  }
  const mk=(team,pm)=>team.map((p,i)=>({name:p.name,role:ROLES[pm[i]]})).sort((a,b)=>ROLES.indexOf(a.role)-ROLES.indexOf(b.role));
  const blue=mk(B,pickB),red=mk(R,pickR);
  const lb=lanes(B,pickB),lr=lanes(R,pickR),laneList=[];let laneDiff=0;
  for(let r=0;r<5;r++)if(lb[r]!=null&&lr[r]!=null){const d=lb[r]-lr[r];laneList.push({role:ROLES[r],b:lb[r],r:lr[r],diff:d});laneDiff+=Math.abs(d);}
  return{blue,red,lanes:laneList,laneDiff,prefHit:bb.score+rr.score};
}
/* players: [{name,pref,side,prio}]  rating: {name:DGP}  prev: 直前の試合 {blue:[名前],red:[名前]} */
function proposeTeams(o){
  const {players,rating={},mode="free",balance=false,prev=null,sit={},rng=Math.random,slots=10,count=3,T=TEAM}=o;
  const dg=n=>rating[n]??RATE.start;
  const pool=players.filter(p=>p.side!=="spec"),wantSpec=players.filter(p=>p.side==="spec");
  if(pool.length<2)return{error:"観戦希望を除いて2人以上必要です。"};
  const ord=pool.map(p=>({p,a:p.prio?1:0,b:sit[p.name]||0,c:rng()})).sort((x,y)=>y.a-x.a||y.b-x.b||y.c-x.c);
  const chosen=ord.slice(0,slots).map(x=>x.p),over=ord.slice(slots).map(x=>x.p);
  const spec=[...over,...shuffle(wantSpec,rng)];
  const n=chosen.length,names=chosen.map(p=>p.name),d=chosen.map(p=>dg(p.name));
  const sizes=n%2?[Math.ceil(n/2),Math.floor(n/2)]:[n/2],full=(1<<n)-1;
  const pside=chosen.map(p=>p.side==="blue"?1:p.side==="red"?2:0);
  const prevTeam={};if(prev){(prev.blue||[]).forEach(x=>prevTeam[x]="b");(prev.red||[]).forEach(x=>prevTeam[x]="r");}
  const cands=[];
  for(let m=1;m<full;m++){
    if(!sizes.includes(popcount(m)))continue;
    let viol=0;for(let i=0;i<n;i++){const inB=(m>>i)&1;if(pside[i]===1&&!inB)viol++;else if(pside[i]===2&&inB)viol++;}
    cands.push({m,viol});
  }
  const minV=Math.min(...cands.map(c=>c.viol)),ok=cands.filter(c=>c.viol===minV);
  const side=m=>{const B=[],R=[];for(let i=0;i<n;i++)((m>>i)&1?B:R).push(chosen[i]);return{B,R};};
  const metrics=m=>{
    const {B,R}=side(m),aB=mean(B.map(p=>dg(p.name))),aR=mean(R.map(p=>dg(p.name)));
    let rep=0;if(prev)for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      if(((m>>i)&1)===((m>>j)&1)&&prevTeam[names[i]]&&prevTeam[names[i]]===prevTeam[names[j]])rep++;
    }
    let miss=0;
    if(mode==="role"&&prefCount)miss=prefCount-(bestPerms(B).score+bestPerms(R).score);
    return{aB,aR,diff:Math.abs(aB-aR),rep,miss};
  };
  const prefCount=chosen.filter(p=>ROLES.includes(p.pref)).length;
  let picks=[];
  if(!balance){
    const all=ok.map(c=>({m:c.m,...metrics(c.m)})),mm=Math.min(...all.map(x=>x.miss)),best=all.filter(x=>x.miss===mm);
    picks=[best[Math.floor(rng()*best.length)]];
  }else{
    const scored=ok.map(c=>{const x=metrics(c.m);return{m:c.m,...x,score:x.diff+T.variety*x.rep+T.rolePenalty*x.miss+rng()*T.jitter};}).sort((a,b)=>a.score-b.score);
    const seen=new Set(),uniq=[];
    for(const c of scored){const k=Math.min(c.m,full^c.m);if(seen.has(k))continue;seen.add(k);uniq.push(c);}
    const far=(a,b)=>Math.min(popcount(a^b),popcount(a^(full^b)));
    for(const c of uniq){if(picks.length>=count)break;if(picks.every(p=>far(p.m,c.m)>=4))picks.push(c);}
    for(const c of uniq){if(picks.length>=count)break;if(!picks.includes(c))picks.push(c);}
  }
  const proposals=picks.map(c=>{
    const {B,R}=side(c.m);
    let blue,red,lanes=[],laneDiff=0;
    if(mode==="role"){const a=assignRoles(B,R,dg,balance,rng);blue=a.blue;red=a.red;lanes=a.lanes;laneDiff=a.laneDiff;}
    else{blue=B.map(p=>({name:p.name,role:""}));red=R.map(p=>({name:p.name,role:""}));}
    const aB=mean(blue.map(p=>dg(p.name))),aR=mean(red.map(p=>dg(p.name)));
    return{blue,red,aB,aR,diff:Math.abs(aB-aR),expB:expected(aB,aR,RATE.eloScale),rep:c.rep||0,lanes,laneDiff,violations:minV};
  });
  if(balance)proposals.sort((a,b)=>a.diff-b.diff);
  return{proposals,spec:spec.map(p=>p.name),chosen:names,violations:minV};
}

const CH={};
function niceTicks(lo,hi,n=5){
  const span=Math.max(hi-lo,10),raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const st=(f<1.5?1:f<3?2:f<7?5:10)*p,a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];

// series: [{name,slot,pts:[{x,y,diff,label}]}]
function lineChart(id,series,o={}){

function chartHover(e){

  const svg=c.querySelector("svg"),r=svg.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width*d.W;
  let x=Math.round((px-d.P.l)/(d.W-d.P.l-d.P.r)*d.xmax);x=Math.max(0,Math.min(d.xmax,x));

  <div class="card"><h3>データを消す</h3><div class="row"><span class="mu">この団体の参加者と履歴をすべて消します。元に戻せないので、先にバックアップを。</span><span class="sp"></span><button class="btn danger" data-act="wipe">${arm("wipe")?"もう一度押して消す":"この団体を空にする"}</button></div></div></div><div class="col">  <div class="card"><h3>見た目</h3><div class="seg">${[["","端末に合わせる"],["dark","ダーク"],["light","ライト"]].map(([v,l])=>`<button data-act="theme" data-v="${v}" aria-pressed="${th===v}">${l}</button>`).join("")}</div></div>
  <div class="card"><h3>バックアップ</h3><div class="grp"><div class="mu">全団体（${DB.groups.length}団体・${total}試合）をまとめてファイルに書き出します。ブラウザのデータは消える場合があるので、ときどき保存しておくと安心です。</div>
    <div class="row"><button class="btn" data-act="backup">ファイルに書き出す</button><button class="btn" data-act="backupcopy">コピーする</button></div>
    <div class="mu" style="margin-top:6px">取り込み（ver2系のファイルも使えます）</div>
    <input type="file" id="impf" accept=".json,application/json" class="field">
    <textarea class="field" id="impt" rows="3" placeholder="またはここに書き出した内容を貼り付け"></textarea>
    <div class="row"><button class="btn" data-act="import" data-v="merge">いまのデータに追加する</button><button class="btn danger" data-act="import" data-v="replace">全部置き換える</button></div>
    <div class="mu3" id="impmsg"></div></div></div>
  <div class="card"><h3>DGP（ドパガキポイント）の仕組み</h3>
    <details class="rule" open><summary>1試合の増減 = TG補正 + KDA補正 + 連勝ボーナス</summary><p>DGP（ドパガキポイント）は、このアプリのレートの単位です。最初はみんな ${R.start} DGP。試合ごとに、この3つを足した分だけ増減します。</p></details>
    <details class="rule"><summary>TG補正（TeamGap補正）</summary><p>チームの平均DGPの差から期待勝率を出し、勝敗との差で決まります。強いチームが勝っても少ししか増えず、弱いチームが勝つと大きく増えます。勝てば最大 +${2*R.win}、負ければ最大 −${2*R.win}（互角なら ±${R.win}）。</p></details>
    <details class="rule"><summary>KDA補正</summary><p>KDA = （キル＋アシスト）÷デス（デス0は1として計算）。ロールごとの基準（${kb}）との差の2倍が補正になり、±${R.kda}で頭打ち。KDAを入力しなかった試合は0です。</p></details>
    <details class="rule"><summary>連勝ボーナス</summary><p>${R.streak.from}連勝目から、勝つたびに +${R.streak.step} ずつ増え、最大 +${R.streak.max}。負けると連勝はリセットされます。</p></details>
    <details class="rule"><summary>チーム分けのしくみ</summary><p>10人未満でも分けられます。サイドの希望は必ず守り、ロールの希望はできるだけ通します。「DGPでバランスを取る」をオンにすると、平均DGPの差が小さい組み合わせを3案出します。直前と同じ組み合わせは出にくく、続けて観戦した人と「優先して出場」の人が先に選ばれます。</p></details></div></div></div>
<div class="card" style="margin-top:12px"><h3>パッチノート</h3>${PATCH.map((p,i)=>`<details class="pv"${i===0?" open":""}><summary><b>ver${esc(p.v)}</b> <span class="mu3">${esc(p.date)}</span></summary>${p.sec.map(([t,a])=>`<h5>${esc(t)}</h5><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join("")}</details>`).join("")}</div>
`;
}
// ---------- データの出し入れ ----------
function backupJSON(){return JSON.stringify({app:"lolpark",ver:VER,exportedAt:new Date().toISOString(),cur:DB.cur,groups:DB.groups.map(g=>({id:g.id,name:g.name,players:g.players,history:g.history}))},null,1);}
function markExported(){DB.meta.exp=DB.groups.reduce((a,g)=>a+g.history.length,0);save();}
function doBackup(){
  try{
    const b=new Blob([backupJSON()],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="lolpark-backup-"+localDate()+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);markExported();toast("書き出しました。ダウンロードフォルダを確認してください。");render();
  }catch(e){toast("書き出せませんでした。「コピーする」を試してください。");}
}
function importData(d,mode){
  if(!d||typeof d!=="object")return "読み込めない形式です。";
  const inc=Array.isArray(d.groups)?d:{groups:[{id:"imp",name:"取り込み",players:d.players||[],history:d.history||[]}],single:true};
  const nd=norm({groups:inc.groups.map(g=>({...g})),cur:inc.cur});
  const nMatch=nd.groups.reduce((a,g)=>a+g.history.length,0);
  if(mode==="replace"){
    if(inc.single&&!Array.isArray(d.groups)){S.players=nd.groups[0].players;S.history=nd.groups[0].history;S.draft=null;}
    else{DB=nd;DB.meta={exp:nMatch};}
    setG(DB.cur);cur=null;UI.props=null;UI.done=null;save();render();
    return `置き換えました（${nMatch}試合）。`;
  }
  let add=0;
  nd.groups.forEach(g=>{
    let t=inc.single?S:DB.groups.find(x=>x.name===g.name);
    if(!t){t={...g,id:DB.groups.some(x=>x.id===g.id)?"g"+uid():g.id};DB.groups.push(t);add+=g.history.length;return;}
    const ids=new Set(t.history.map(m=>String(m.id)));
    g.history.forEach(m=>{if(!ids.has(String(m.id))){t.history.push(m);ids.add(String(m.id));add++;}});
    t.history.sort((a,b)=>a.id-b.id);
    g.players.forEach(p=>{if(!t.players.some(q=>q.name===p.name))t.players.push(p);});
  });
  _rc=null;save();render();
  return `追加しました（新しい試合 ${add}件）。`;
}
function demoData(){
  const rng=mulberry32(20261029);
  const names=["つよし","たける","みお","ゆうき","れん","あかね","しょう","ひなた","こうた","さくら"];
  const skill={};names.forEach(n=>skill[n]=(rng()-0.5)*260);
  const pool={TOP:["ガレン","ネクサス","ケネン","オーン","フィオラ"],JG:["リー・シン","ヴィエゴ","グレイブス","ジャーヴァンIV","ワーウィック"],MID:["アーリ","ヤスオ","ゼド","ガリオ","ライズ"],ADC:["ジンクス","ケイトリン","エズリアル","ジン","ミス・フォーチュン"],SUP:["ソナ","ナミ","レオナ","ブリッツクランク","ルル"]};
  const roles=["TOP","JG","MID","ADC","SUP"],hist=[];
  const base=new Date();base.setDate(base.getDate()-70);
  for(let i=0;i<40;i++){
    const order=shuffle(names,rng),B=order.slice(0,5),Rd=order.slice(5);
    const sb=B.reduce((a,n)=>a+skill[n],0)/5,sr=Rd.reduce((a,n)=>a+skill[n],0)/5;
    const winner=rng()<1/(1+Math.pow(10,-(sb-sr)/380))?"blue":"red";
    const mk=(team,win)=>shuffle(roles,rng).map((r,j)=>{
      const n=team[j],pw=skill[n]/260,k=Math.max(0,Math.round(4+rng()*7+pw*3+(win?1.5:-1))),d=Math.max(0,Math.round(4+rng()*5-pw*2+(win?-1:1.5))),a=Math.max(0,Math.round(4+rng()*10+(r==="SUP"?4:0)+(win?2:0)));
      const pl=pool[r];return{name:n,role:r,champ:pl[Math.floor(rng()*pl.length)],k,d,a};
    });
    const dt=new Date(base);dt.setDate(base.getDate()+Math.floor(i*1.7));
    hist.push({id:1700000000000+i*86400000/3,date:localDate(dt),mode:"role",winner,blue:mk(B,winner==="blue"),red:mk(Rd,winner==="red"),spec:[]});
  }
  const g={id:"g"+uid(),name:"デモ",players:names.map(n=>({name:n,pref:"",side:"",prio:false})),history:hist};
  DB.groups.push(g);DB.meta.exp+=hist.length;setG(g.id);cur=null;UI.props=null;UI.done=null;UI.sel=null;save();render();
  toast("「デモ」団体を作りました。右上で元の団体に戻せます。");
}
function renameMember(from,to){
  to=to.trim();
  if(!from||!to||from===to)return "新しい名前を入力してください。";
  if(S.history.some(m=>[...m.blue,...m.red].some(p=>p.name===from)&&[...m.blue,...m.red].some(p=>p.name===to)))return "同じ試合に両方の名前があるため統合できません。";
  let n=0;
  const fix=p=>{if(p.name===from){p.name=to;n++;}};
  S.history.forEach(m=>{m.blue.forEach(fix);m.red.forEach(fix);if(m.spec)m.spec=m.spec.map(x=>x===from?to:x);});
  if(S.players.some(p=>p.name===from)){
    if(S.players.some(p=>p.name===to))S.players=S.players.filter(p=>p.name!==from);else S.players.forEach(p=>{if(p.name===from)p.name=to;});
  }
  if(cur){[...cur.blue,...cur.red].forEach(fix);cur.spec=cur.spec.map(x=>x===from?to:x);S.draft=cur;}
  save();render();
  return `${from} → ${to}（${n}件）に変更しました。`;
}
function rankText(){
  const {rat,stats}=calc();
  return `【${S.name} DGPランキング】（${S.history.length}試合）\n`+ordered().map((n,i)=>`${i+1}. ${n}　${rat.rt[n]} DGP　${stats[n].w}勝${stats[n].g-stats[n].w}敗`).join("\n");
}
function getTheme(){try{return localStorage.getItem("lolpark_theme")||"";}catch(e){return "";}}
function setTheme(v){try{if(v)localStorage.setItem("lolpark_theme",v);else localStorage.removeItem("lolpark_theme");}catch(e){}applyTheme();}
function applyTheme(){const t=getTheme();if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");}

// ---------- イベント ----------
function addFromInput(){
  const el=$("nm");if(!el)return;
  const v=el.value;if(!v.trim())return;
  const r=addNames(v);
  if(r.dup.length&&!r.a)toast(r.dup.join("、")+" はすでに追加されています。");
  UI.focus="nm";render();
  if($("nm"))$("nm").value="";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  switch(a){
    case"view":UI.view=d.v;UI.sheet=null;window.scrollTo(0,0);render();break;
    case"sub":UI.sub=d.v;render();break;
    case"add":addFromInput();break;
    case"addn":addNames(d.n);render();break;
    case"addlast":{const m=S.history[S.history.length-1];if(m)addNames([...m.blue,...m.red].map(p=>p.name).concat(m.spec||[]).join("、"));render();break;}
    case"bulk":UI.bulk=!UI.bulk;UI.focus=UI.bulk?"bulkt":null;render();break;
    case"bulkadd":{const r=addNames($("bulkt").value);UI.bulk=false;render();toast(r.a?r.a+"人を追加しました。":"追加できる名前がありませんでした。");break;}
    case"clearroster":S.players=[];save();render();break;
    case"rm":S.players=S.players.filter(p=>p.name!==d.n);UI.openRm.delete(d.n);save();render();break;
    case"pref":{const p=playerObj(d.n);if(p){p.pref=d.v;save();render();}break;}
    case"side":{const p=playerObj(d.n);if(p){p.side=d.v;save();render();}break;}
    case"gen":case"regen":
      gen();break;
    case"plan":pickPlan(+d.i);break;
    case"qc":{const p=cur[d.t][+d.i];p.champ=d.c;S.draft=cur;save();render();break;}
    case"win":if(cur)saveMatch(d.w);break;
    case"discard":if(arm("discard")){cur=null;S.draft=null;UI.props=null;UI.arm=null;save();render();}else armSet("discard");break;
    case"discord":copyText(discordText()).then(ok=>toast(ok?"コピーしました。Discordに貼り付けてください。":"コピーできませんでした。"));break;
    case"rematch":rematch();break;
    case"newround":UI.done=null;render();break;
    case"undo":undoMatch(+d.id);break;
    case"toastact":{const f=UI.toastFn;toast("");if(f)f();break;}
    case"demo":demoData();break;
    case"player":UI.sheet=d.n;render();break;
    case"closesheet":UI.sheet=null;render();break;
    case"pickc":{
      const i=UI.sel.indexOf(d.n);
      if(i>=0)UI.sel.splice(i,1);
      else if(UI.sel.length>=8)toast("同時に表示できるのは8人までです。");
      else{assignSlot(d.n);UI.sel.push(d.n);}
      render();break;}
    case"tbl":UI.tbl=!UI.tbl;render();break;
    case"copyrank":copyText(rankText()).then(ok=>toast(ok?"コピーしました。":"コピーできませんでした。"));break;
    case"hw":UI.hf.w=d.v;UI.hf.n=30;render();break;
    case"more":UI.hf.n+=30;render();break;
    case"openm":UI.openM=UI.openM==+d.id?null:+d.id;render();break;
    case"setwin":{const m=S.history.find(x=>x.id==d.id);if(m){m.winner=d.v;save();render();}break;}
    case"delm":
      if(arm("del"+d.id)){S.history=S.history.filter(x=>x.id!=d.id);UI.openM=null;UI.arm=null;save();render();toast("削除しました。");}
      else armSet("del"+d.id);break;
    case"gnew":{const v=$("gname").value.trim();if(!v)break;if(DB.groups.some(g=>g.name===v)){toast("同じ名前の団体があります。");break;}
      const g={id:"g"+uid(),name:v,players:[],history:[]};DB.groups.push(g);setG(g.id);cur=null;UI.props=null;UI.done=null;UI.sel=null;save();render();toast("「"+v+"」を作って切り替えました。");break;}
    case"grename":{const v=$("grename").value.trim();if(!v)break;if(DB.groups.some(g=>g!==S&&g.name===v)){toast("同じ名前の団体があります。");break;}S.name=v;save();render();toast("名前を変えました。");break;}
    case"gdel":
      if(arm("gdel")){DB.groups=DB.groups.filter(g=>g!==S);setG(DB.groups[0].id);cur=S.draft||null;UI.props=null;UI.done=null;UI.sel=null;UI.arm=null;save();render();toast("削除しました。");}
      else armSet("gdel");break;
    case"wipe":
      if(arm("wipe")){S.players=[];S.history=[];S.draft=null;cur=null;UI.props=null;UI.done=null;UI.sel=null;UI.arm=null;save();render();toast("空にしました。");}
      else armSet("wipe");break;
    case"theme":setTheme(d.v);render();break;
    case"rename":{const m=renameMember($("rn-from").value,$("rn-to").value);toast(m);break;}
    case"backup":doBackup();break;
    case"backupcopy":copyText(backupJSON()).then(ok=>{if(ok)markExported();toast(ok?"コピーしました。メモ帳などに貼り付けて保存してください。":"コピーできませんでした。");render();});break;
    case"nudgeoff":DB.meta.exp=DB.groups.reduce((a,g)=>a+g.history.length,0);save();render();break;
    case"import":{
      const msg=$("impmsg"),txt=$("impt").value.trim();
      const run=text=>{let d;try{d=JSON.parse(text);}catch(err){msg.textContent="読み込めませんでした。書き出したファイルの内容か確認してください。";return;}
        if(d.groups||d.history||d.players){const r=importData(d,t.dataset.v);toast(r);}else msg.textContent="読み込めない形式です。";};
      const f=$("impf").files&&$("impf").files[0];
      if(f){const fr=new FileReader();fr.onload=()=>run(String(fr.result));fr.readAsText(f);}
      else if(txt)run(txt);else msg.textContent="ファイルを選ぶか、内容を貼り付けてください。";
      break;}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="grp"){setG(t.value);cur=S.draft||null;UI.props=null;UI.done=null;UI.sel=null;UI.openM=null;save();render();return;}
  if(t.dataset.opt){S.opt[t.dataset.opt]=t.checked;save();return;}
  if(t.dataset.prio!=null){const p=playerObj(t.dataset.prio);if(p){p.prio=t.checked;save();render();}return;}
  if(t.dataset.f&&cur){const p=cur[t.dataset.t][+t.dataset.i];if(t.dataset.f==="role"){p.role=t.value;S.draft=cur;save();const w=$("warns");if(w)w.innerHTML=warnsHTML();}return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.rm!=null){if(d.open)UI.openRm.add(d.dataset.rm);else UI.openRm.delete(d.dataset.rm);}},true);
const numOrNull=v=>{v=String(v).replace(/[^\d]/g,"");return v===""?null:Math.min(99,+v);};
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="hq"){UI.hf.q=t.value;UI.hf.n=30;const p=t.selectionStart;render();const q=$("hq");if(q){q.focus();q.setSelectionRange(p,p);}return;}
  if(t.dataset.f&&cur){
    const p=cur[t.dataset.t][+t.dataset.i],f=t.dataset.f;
    if(f==="champ")p.champ=t.value;
    else if(f==="role")return;
    else{const v=numOrNull(t.value);p[f]=v;if(String(v??"")!==t.value)t.value=v==null?"":v;}
    S.draft=cur;save();const w=$("warns");if(w)w.innerHTML=warnsHTML();return;
  }
  if(t.dataset.e){
    const m=S.history.find(x=>x.id==t.dataset.m);if(!m)return;
    if(t.dataset.e==="date"){if(t.value)m.date=t.value;save();return;}
    const p=m[t.dataset.s][+t.dataset.i],f=t.dataset.e;
    if(f==="champ")p.champ=t.value;else if(f==="role")p.role=t.value;else{const v=numOrNull(t.value);p[f]=v;if(String(v??"")!==t.value)t.value=v==null?"":v;}
    save();
  }
});
// KDAの貼り付け（5/2/7 など）
document.addEventListener("paste",e=>{
  const t=e.target;if(!(t.dataset&&(t.dataset.f==="k"||t.dataset.e==="k")))return;
  const k=parseKDA((e.clipboardData||window.clipboardData).getData("text"));if(!k)return;
  e.preventDefault();
  const row=t.parentNode,fs=t.dataset.f?"f":"e";
  ["k","d","a"].forEach((f,i)=>{const el=row.querySelector(`[data-${fs}="${f}"]`);if(el){el.value=k[i];el.dispatchEvent(new Event("input",{bubbles:true}));}});
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Escape"){if(UI.sheet){UI.sheet=null;render();}return;}
  if(t.dataset&&t.dataset.f&&t.dataset.t&&t.tagName==="INPUT"&&!e.isComposing&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
    const F=["champ","k","d","a"],col=(t.dataset.t==="red"?4:0)+F.indexOf(t.dataset.f),row=+t.dataset.i;
    const txt=t.dataset.f==="champ";
    if(txt&&e.key==="ArrowLeft"&&t.selectionStart!==0)return;
    if(txt&&e.key==="ArrowRight"&&t.selectionStart!==t.value.length)return;
    let c=col,r=row;
    if(e.key==="ArrowLeft")c--;else if(e.key==="ArrowRight")c++;else if(e.key==="ArrowUp")r--;else r++;
    const q=document.querySelector(`input[data-f="${F[c%4]}"][data-t="${c>=4?"red":"blue"}"][data-i="${r}"]`);
    if(c>=0&&c<8&&q){e.preventDefault();q.focus();q.select();}
    else if(e.key==="ArrowUp"||e.key==="ArrowDown")e.preventDefault();
    return;
  }
  if(e.key!=="Enter"||e.isComposing)return;
  if(t.id==="nm"){e.preventDefault();addFromInput();return;}
  if(t.id==="gname"){$("main").querySelector('[data-act="gnew"]').click();return;}
  if(t.dataset&&t.dataset.f&&t.tagName==="INPUT"){ // Enterで次の入力欄へ
    e.preventDefault();
    const all=[...document.querySelectorAll('.board input[data-f], .teams input[data-f]')],i=all.indexOf(t);
    const nx=all[i+1];if(nx){nx.focus();nx.select();}
  }
});
window.addEventListener("storage",e=>{
  if(e.key!==K||!e.newValue)return;
  try{const keep=DB.cur;DB=norm(JSON.parse(e.newValue));setG(DB.groups.some(g=>g.id===keep)?keep:DB.cur);cur=S.draft||null;_rc=null;render();}catch(err){}
});
// ---------- はじめる ----------
applyTheme();
DB=loadDB();setG(DB.cur);cur=S.draft||null;
if(cur&&!Array.isArray(cur.blue)){cur=null;S.draft=null;}
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
